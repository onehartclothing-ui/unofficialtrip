<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Your Titu Backpackers Verification Code</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #0B0D0C; color: #F4F0E8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div style="max-width: 520px; margin: 0 auto; border: 1px solid #262A27; border-radius: 12px; padding: 32px; background-color: #121513;">
      <p style="margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #E86B35; font-weight: 600;">
        TITU BACKPACKERS · COORG 2026
      </p>
      <h1 style="margin: 12px 0 8px; font-size: 24px; color: #F4F0E8;">
        Your Titu Backpackers Verification Code
      </h1>
      <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #B9C0BA;">
        Enter the 6-digit verification code below on the Titu Backpackers registration page to continue your booking:
      </p>
      <div style="margin: 0 0 24px; padding: 18px 24px; border-radius: 8px; background-color: #0B0D0C; border: 1px solid #E86B35; text-align: center;">
        <span style="font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 0.25em; color: #F4F0E8;">
          {{ .Token }}
        </span>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #8A918C;">
        This code expires in 60 minutes. If you did not request this code, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
