project_id = "cokrajufypdilwlkqfda"

[auth]
enabled = true
site_url = "https://unofficialtrip-phi.vercel.app"
additional_redirect_urls = [
  "https://unofficialtrip-phi.vercel.app/auth/callback",
  "https://unofficialtrip-phi.vercel.app/register",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/register",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/register"
]

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Titu Backpackers Verification Code"
